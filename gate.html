<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Malaika Saini</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #faf9f6;
    --ink: #16161a;
    --ink-2: #6c6c72;
    --ink-3: #9d9da3;
    --rule: rgba(22,22,26,0.09);
    --sans: 'General Sans', system-ui, -apple-system, sans-serif;
    --serif: 'Instrument Serif', Georgia, serif;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh; min-height: 100svh;
    display: flex; align-items: center; justify-content: center;
    background: var(--paper); color: var(--ink);
    font-family: var(--sans); -webkit-font-smoothing: antialiased; font-synthesis: none;
    padding: 24px;
  }
  ::selection { background: #e4e1f5; }
  .col { width: 100%; max-width: 560px; }
  .hey {
    font-family: var(--serif); font-weight: 400;
    font-size: clamp(32px, 4.4vw, 46px);
    line-height: 1; letter-spacing: -0.015em; margin: 0 0 16px;
  }
  .lede {
    font-size: clamp(17px, 2.1vw, 20px); line-height: 1.44;
    letter-spacing: -0.02em; color: var(--ink-3); margin: 20px 0 0; font-weight: 400;
  }
  .lede b { font-weight: 400; color: var(--ink); }
  form { margin-top: 44px; display: flex; align-items: flex-end; gap: 18px; }
  input[type=password] {
    flex: 1; min-width: 0;
    background: transparent; border: none; border-bottom: 1px solid var(--rule);
    padding: 6px 2px 10px;
    font-family: var(--serif); font-size: 20px; letter-spacing: 0.04em;
    color: var(--ink); outline: none; border-radius: 0;
    transition: border-color .35s ease;
  }
  input[type=password]::placeholder {
    font-family: var(--serif); font-style: italic; font-size: 17px;
    letter-spacing: 0.005em; color: var(--ink-3);
  }
  input[type=password]:focus { border-bottom-color: rgba(22,22,26,0.4); }
  button {
    position: relative; flex: none;
    background: none; border: none; cursor: pointer; padding: 0 0 12px;
    font-family: var(--serif); font-style: italic; font-size: 16px;
    letter-spacing: 0.005em; color: var(--ink-2);
    transition: color .35s ease;
  }
  button::after {
    content: ''; position: absolute; left: 0; bottom: 8px; width: 100%; height: 1px;
    background: currentColor; opacity: 0.3;
    transform: scaleX(0); transform-origin: left;
    transition: transform .5s cubic-bezier(.16,1,.3,1), opacity .35s ease;
  }
  button:hover { color: var(--ink); }
  button:hover::after { transform: scaleX(1); opacity: .55; }
  .note {
    font-family: var(--serif); font-style: italic;
    font-size: 14.5px; color: var(--ink-3); margin-top: 18px; letter-spacing: 0.005em;
  }
  .err { display: none; color: #b04a3a; }
</style>
</head>
<body>
  <div class="col">
    <h1 class="hey">Hey,</h1>
    <p class="lede">this portfolio is <b>password protected</b>.
      If I shared the password with you, you're in the right place.</p>
    <form method="post">
      <input type="password" name="password" placeholder="the password" autocomplete="current-password" autofocus required>
      <button type="submit">come on in</button>
    </form>
    <p class="note err">that password didn't work - try again?</p>
  </div>
</body>
</html>
